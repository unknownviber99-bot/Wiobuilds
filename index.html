 <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WIOBUILDS</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- LOADER -->
<div id="loader">
  <div class="loader-text">INITIALIZING...</div>
</div>

<canvas id="bg"></canvas>

<!-- SIDEBAR -->
<div class="sidebar">
  <h3>CORE</h3>
  <ul>
    <li class="active">Dashboard</li>
    <li>Projects</li>
    <li>Tasks</li>
  </ul>
</div>

<!-- MAIN -->
<main>

<header>
  <div class="logo">WIOBUILDS</div>
  <nav>
    <a href="#tiers">Pricing</a>
    <a href="#work">Work</a>
  </nav>
</header>

<section class="hero">
  <h1>WE BUILD <span>WEBSITES</span><br>THAT WORK.</h1>
  <p>High-performance digital architecture.</p>
  <button id="cta">START</button>
</section>

<section id="tiers">
  <h2>SELECT PLAN</h2>

  <div class="cards">
    <div class="card active" data-tier="core">CORE</div>
    <div class="card" data-tier="pro">PRO</div>
    <div class="card" data-tier="ultra">ULTRA</div>
  </div>

  <button id="confirm">CONFIRM</button>
</section>

<section id="work">
  <h2>WORK</h2>
  <div class="cards">
    <div class="card">PROJECT 01</div>
    <div class="card">PROJECT 02</div>
  </div>
</section>

<section class="auth">
  <h2>LOGIN</h2>
  <input placeholder="USERNAME">
  <input placeholder="PASSWORD" type="password">
  <button>ENTER</button>
</section>

</main>

<script src="script.js"></script>
</body>
		</html>
